services:
  db:
    image: postgres:16
    container_name: devlinks-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: devlinks
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d devlinks"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: